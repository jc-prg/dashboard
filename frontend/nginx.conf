# HTTP-only config — used when no TLS certificates are present.
# For internet exposure, mount TLS certs into /etc/nginx/certs/ to enable HTTPS automatically.
server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Path-prefix support (e.g. https://host/folder/): if the outer proxy forwards the
    # prefix instead of stripping it, drop it here so /folder/api/... and
    # /folder/assets/... map to the same routes as without a prefix.
    rewrite ^/(?!api/).+?/(api/.*)$ /$1 last;
    rewrite ^/(?!assets/).+?/(assets/.*|icon\.png|manifest\.json)$ /$1 last;

    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
