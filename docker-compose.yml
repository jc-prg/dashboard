version: "3.9"

services:
  backend:
    build: ./backend
    restart: always
    volumes:
      - ./config/items.yml:/app/config/items.yml
      - ./config/secrets:/app/config/secrets:ro
      - ./config/2fa-tokens.json:/app/config/2fa-tokens.json
      - ./.env:/app/.env
      # Docker socket is NOT mounted by default — it grants host-level root access.
      # Only add it if you use LOCAL_HOST_IPS to manage containers on this machine.
      # See docker-compose.local.yml for the override.
    environment:
      - PORT=3001
      - CHECK_INTERVAL_SECONDS=60
      - REQUEST_TIMEOUT_MS=5000
      - SSH_CONNECT_TIMEOUT_MS=15000
      - LOCAL_HOST_IPS=${LOCAL_HOST_IPS:-}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - RESET_PWD=${RESET_PWD:-0}
      - ENV_FILE=/app/.env
      - INTRANET_CIDR=${INTRANET_CIDR:-}
      - TWO_FA_EMAIL=${TWO_FA_EMAIL:-}
      - TWO_FA_VALIDITY_DAYS=${TWO_FA_VALIDITY_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    networks:
      - dashboard

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS: place cert.pem + key.pem here to enable HTTPS automatically.
      # Leave the directory empty to run HTTP only (suitable behind a TLS-terminating proxy).
      - ./config/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - dashboard

networks:
  dashboard:
    name: dashboard_net
